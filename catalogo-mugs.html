<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Completo de Mugs | Urrecolor</title>
<meta name="theme-color" content="#09090b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: {
      display: ['Syne', 'ui-sans-serif', 'system-ui', 'sans-serif'],
      sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif']
    },
    colors: {
      ink: { 950: '#09090b', 900: '#111114', 800: '#17171c', 700: '#26262d' },
      sun: { 300: '#ffe14d', 500: '#ff9d1c', 600: '#ff5b2e' }
    }
  } }
}
</script>
<style>
  :root { color-scheme: dark; --grad: linear-gradient(120deg, white, white 50%, white 100%); }
  html { scroll-padding-top: 4.5rem; }
  body { background: #09090b; color: #f2efe9; -webkit-font-smoothing: antialiased; }
  .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; font-weight: 700; transition: all .25s; }
  .btn:hover { transform: translateY(-2px); }
  .btn-ghost { border: 1px solid #2e2e36; color: #f2efe9; }
  .btn-ghost:hover { border-color: #ff9d1c; background: rgba(255,157,28,.08); }

  .panel { background: #111114; border: 1px solid #23232a; border-radius: 1rem; }
  .lift { overflow: hidden; transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s; }
  .lift:hover { transform: translateY(-4px); border-color: #3b3b46; box-shadow: 0 16px 32px -16px rgba(255,140,30,.3); }

  .ph { position: relative; aspect-ratio: 4 / 5; display: grid; place-items: center; overflow: hidden; background: #1a1a20; }
  
  .nav-link { position: relative; color: #a8a8b2; transition: color .2s; }
  .nav-link:hover { color: #fff; }

  /* Animación reveal simplificada */
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
</style>
</head>
<body class="font-sans pt-20">

<!-- Header -->
<header class="fixed inset-x-0 top-0 z-50 border-b border-white/5 bg-ink-950/80 backdrop-blur-xl">
  <div class="mx-auto max-w-7xl px-5 sm:px-8">
    <div class="flex h-16 items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <img src="imagenes/logo_urrecolor.jpg" alt="Logo Urrecolor" class="h-10 w-auto rounded-xl object-contain">
        <span class="font-display text-xl font-bold tracking-tight">Urre<span class="grad-text">color</span></span>
      </a>
      <nav class="hidden md:block">
        <ul class="flex items-center gap-8 text-sm font-semibold">
          <li><a class="nav-link" href="index.html">Volver al Inicio</a></li>
          <li><a class="nav-link" href="catalogo-mugs.html">Mugs</a></li>
          <li><a class="nav-link" href="catalogo-camisetas.html">Camisetas</a></li>
          <li><a class="nav-link" href="catalogo-buzos.html">Buzos</a></li>

        </ul>
      </nav>
      <a href="index.html" class="md:hidden text-sm font-semibold text-zinc-300">Volver</a>
    </div>
  </div>
</header>

<main class="py-12">
  <div class="mx-auto max-w-[90rem] px-4 sm:px-6 lg:px-8">
    <div class="reveal mb-10 text-center">
      <h1 class="font-display text-3xl font-bold tracking-tight sm:text-4xl">Catálogo completo de Mugs</h1>
      <p class="mt-3 text-sm text-zinc-400">Explora todos nuestros diseños disponibles.</p>
    </div>
    
    <!-- Aquí es donde las tarjetas se hacen más pequeñas ajustando las columnas -->
    <ul id="gridCatalogo" class="grid gap-4 grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></ul>
  </div>
   <!-- NUEVO BOTÓN: Sube tu propia idea -->
    <div class="mt-12 flex justify-center reveal">
      <a href="index.html#contacto" class="btn btn-ghost px-8 py-3 text-sm">Sube tu propia idea</a>
    </div>
  </div> <!-- Cierre del div mx-auto -->
</main>

<footer class="border-t border-white/5 py-8 mt-12">
  <div class="mx-auto flex max-w-7xl flex-col items-center justify-center px-5 text-sm text-zinc-500">
    <p>&copy; <span id="year"></span> Urrecolor. Todos los derechos reservados.</p>
  </div>
</footer>

<script>
  const $= s => document.querySelector(s);$('#year').textContent = new Date().getFullYear();

  // Aquí pegas TODO tu arreglo largo de camisetas (puedes agregar muchísimas más)
 const mugs = [
  { n: 'Black Sabbath · Edición rock', t: 'Sublimación', d: 'Taza blanca con un diseño de Black Sabbath, llamas y una ilustración gótica. Ideal para los amantes del heavy metal y el rock.', img: 'imagenes/mugs/black sabbath.png' },
  { n: 'Route 66 · Estilo vintage', t: 'Sublimación', d: 'Taza blanca con el emblemático escudo de la Ruta 66, inspirada en los viajes por carretera y la estética americana retro.', img: 'imagenes/mugs/mug ROUTE.png' },
  { n: 'Mirada misteriosa', t: 'Sublimación', d: 'Taza blanca con una ilustración de una mirada intensa, cubierta con un velo texturizado en tonos grises y negros.', img: 'imagenes/mugs/MUSULMAN.png' },
  { n: 'Mug Mágico· Café y vapor', t: 'Sublimación', d: 'Taza negra de estilo elegante y minimalista, ideal para disfrutar de un café con un diseño sobrio y moderno.', img: 'imagenes/mugs/mugMagico.jpg' },
  { n: 'Fútbol americano · Arte deportivo', t: 'Sublimación', d: 'Taza blanca con una ilustración deportiva multicolor de un jugador de fútbol americano. Perfecta para aficionados y regalos personalizados.', img: 'imagenes/mugs/FUT AMERI1.png' },
  { n: 'Navidad · Diseño Festivo', t: 'Sublimación', d: 'Taza blanca con una ilustración navideña de "HO HO HO" en estampado de cuadros, decorada con un reno, Papá Noel y un muñeco de nieve. Perfecta para la temporada festiva y regalos personalizados.', img: 'imagenes/mugs/new4.jpeg'}, 



  { n: 'Gustavo Cerati · Ícono musical', t: 'Sublimación', d: 'Taza blanca con ilustración del legendario músico tocando la guitarra y su apellido destacado en tipografía verde.', img: 'imagenes/mugs/mug20.jpeg' },
  { n: 'World Cup 2026 · USA', t: 'Sublimación', d: 'Taza conmemorativa de la Copa Mundial de Fútbol 2026 con el trofeo envuelto en los colores de la bandera estadounidense.', img: 'imagenes/mugs/mug21.jpeg' },
  { n: 'Felicidad por dentro · Margarita', t: 'Sublimación', d: 'Diseño limpio y minimalista con una margarita central y la frase inspiradora "Felicidad por dentro".', img: 'imagenes/mugs/mug22.jpeg' },
  { n: 'Mamá Arcoíris · Regalos', t: 'Sublimación', d: 'Taza colorida con un arcoíris de texturas, flores y la palabra "mamá". Ideal para obsequios especiales.', img: 'imagenes/mugs/mug23.jpeg' },
  { n: 'Good Vibes · Hongos retro', t: 'Sublimación', d: 'Estética vintage con ilustraciones de hongos estilo años setenta y la frase "GOOD VIBES" en tonos cálidos.', img: 'imagenes/mugs/mug24.jpeg' },
  { n: 'Irradia Vibraciones Positivas', t: 'Sublimación', d: 'Diseño floral estilo retro en tonos mostaza y naranjas con un mensaje positivo en tipografía psicodélica.', img: 'imagenes/mugs/mug25.jpeg' },
    
  { n: 'Amor · Personalizable', t: 'Sublimación', d: 'Taza blanca personalizable con espacio para foto, decorada con pequeños dibujos y la palabra "amor!" con un corazón azul.', img: 'imagenes/mugs/new2.jpeg' },
  { n: 'Tropical · Verano', t: 'Sublimación', d: 'Diseño colorido y vibrante de estilo tropical con ilustraciones de una piña, hojas verdes y formas abstractas.', img: 'imagenes/mugs/new3.jpeg' },
  { n: 'Navidad · Diseño Festivo', t: 'Sublimación', d: 'Taza blanca con una ilustración navideña de "HO HO HO" en estampado de cuadros, decorada con un reno, Papá Noel y un muñeco de nieve. Perfecta para la temporada festiva y regalos personalizados.', img: 'imagenes/mugs/new4.jpeg'}, 
  { n: 'Nirvana · Rock', t: 'Sublimación', d: 'Taza blanca con el clásico logotipo de la cara sonriente amarilla y el texto de la banda Nirvana.', img: 'imagenes/mugs/new5.jpeg' },
  { n: 'Motivacional · Vive la vida', t: 'Sublimación', d: 'Taza con tipografía variada y colorida que forma la frase "¡Vive! la Vida se va Rápido".', img: 'imagenes/mugs/new6.jpeg' },
  { n: 'Optimismo · Gran día', t: 'Sublimación', d: 'Diseño minimalista con la frase motivacional "HOY Será un GRAN día" acompañada del dibujo de un sol.', img: 'imagenes/mugs/new7.jpeg' },
  { n: 'Inspiracional · El mundo necesita', t: 'Sublimación', d: 'Taza con efecto de salpicaduras oscuras y la frase inspiracional "HAY ALGO EN TI QUE EL MUNDO NECESITA".', img: 'imagenes/mugs/new8.jpeg' }


];

  const shirtIcon = '<svg viewBox="0 0 64 64" class="h-16 w-16 text-white/20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 8 8 14l4 12 6-3v31h28V23l6 3 4-12-14-6c-2 4-6 6-10 6s-8-2-10-6z"/></svg>';
  
  function renderSmallGrid(id, list, icon, noun) {
    $(id).innerHTML = list.map((p, i) => `
      <li class="reveal" style="transition-delay:${(i % 5) * 50}ms">
        <article class="panel lift flex h-full flex-col">
          <div class="ph">
            ${p.img 
              ? `<img src="${p.img}" alt="${p.n}" class="absolute inset-0 h-full w-full object-cover" loading="lazy">` 
              : `${icon}`}
          </div>
          <!-- PADDING Y TEXTOS MÁS PEQUEÑOS -->
          <div class="flex flex-1 flex-col p-4">
            <span class="text-xs font-semibold text-sun-500">${p.t}</span>
            <h3 class="mt-1 font-display text-base font-bold leading-tight">${p.n}</h3>
            <!-- line-clamp-2 recorta el texto a 2 líneas para que todas las tarjetas midan parecido -->
            <p class="mt-2 flex-1 text-xs leading-relaxed text-zinc-400 line-clamp-2">${p.d}</p>
            <button type="button" class="btn btn-ghost mt-4 w-full px-3 py-2 text-xs" onclick="window.location.href='index.html#contacto'">Cotizar</button>
          </div>
        </article>
      </li>`).join('');
  }

  renderSmallGrid('#gridCatalogo', mugs, shirtIcon, 'mugs');

  /* Scroll reveal */
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); obs.unobserve(en.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
